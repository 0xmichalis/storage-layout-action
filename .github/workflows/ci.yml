name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check dist is up to date
        run: git diff --exit-code -- dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          cache: false
      - run: npm ci
      - run: npm run build
      - run: bash test/e2e.sh

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the action against the fixture project
        uses: ./
        with:
          working-directory: test/fixture-project
          base: ${{ github.sha }}
      - name: Make an incompatible change with a fresh snapshot
        run: |
          sed -i 's/address public manager;/uint256 public sneaky;\n    address public manager;/' src/Vault.sol
          forge inspect Vault storage-layout --json > storage-layouts/Vault.json
        working-directory: test/fixture-project
      - name: Expect the action to fail
        id: incompatible
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture-project
          base: ${{ github.sha }}
      - name: Assert the incompatible change was rejected
        run: test "${{ steps.incompatible.outcome }}" = "failure"
