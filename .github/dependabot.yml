version: 2
updates:
  # Version updates are disabled (open-pull-requests-limit: 0) because
  # Dependabot cannot rebuild dist/index.cjs, so every npm PR fails the
  # dist-up-to-date CI check until `npm run build` is run on the branch.
  # Security updates (enabled in repo settings) still open PRs; an
  # auto-triage rule in repo settings limits them to severity >= high.
  # Those PRs still need a manual dist rebuild before merging.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Covers the workflows and the pinned actions in action.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
